networks:
  availia:
    # Подсеть закреплена: автоматическую Docker выдал из 172.19.0.0/16, а VPN (tun0) поднимает
    # туннель в том же диапазоне и уводит туда трафик к контейнерам — сайт с хоста пропадал
    ipam:
      config:
        - subnet: 10.88.0.0/24

volumes:
  postgres_data:
    labels:
      keep: "true"
  pgadmin_data:
    labels:
      keep: "true"
  go_cache:

services:
  nginx:
    build:
      context: ./dockerfiles
      dockerfile: nginx.dockerfile
    image: availia/nginx:dev
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./src:/var/www/html:delegated
    depends_on:
      - php
      - gateway
    networks:
      - availia

  php:
    build:
      context: ./dockerfiles
      dockerfile: php.dockerfile
      args:
        - UID=${HOST_UID:-1000}
        - GID=${HOST_GID:-1000}
    image: availia/php:dev
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html:delegated
    depends_on:
      - postgres
      - redis
    networks:
      - availia

  # ─────────────────────────────────────────────
  # Go-гейтвей: стриминг ответов нейросетей (SSE/WebSocket) через proxyapi.
  # Снаружи доступен через nginx по /gw/. В dev — горячая перезагрузка через air.
  # ─────────────────────────────────────────────
  gateway:
    build:
      context: ./dockerfiles
      dockerfile: go.dockerfile
      args:
        - UID=${HOST_UID:-1000}
        - GID=${HOST_GID:-1000}
    image: availia/gateway:dev
    working_dir: /app
    volumes:
      - ./gateway:/app:delegated
      - go_cache:/go
    environment:
      GATEWAY_ADDR: ":8080"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      PROXY_API_URL: ${PROXY_API_URL:-https://api.proxyapi.ru/v1}
      PROXY_API_KEY: ${PROXY_API_KEY:-}
      POLZA_API_URL: ${POLZA_API_URL:-https://polza.ai/api/v1}
      POLZA_API_KEY: ${POLZA_API_KEY:-}
      REDIS_DB: "2"
      GATEWAY_SECRET: ${GATEWAY_SECRET:?error}
      # Сюда гейтвей отчитывается о готовом ответе
      LARAVEL_URL: "http://nginx"
    depends_on:
      - redis
    networks:
      - availia

  postgres:
    image: postgres:18-alpine
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      # С 18-й версии данные лежат в /var/lib/postgresql/<major>/docker — монтируем родителя
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${DB_DATABASE:?error}
      POSTGRES_USER: ${DB_USERNAME:?error}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?error}
    networks:
      - availia

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?error}"]
    ports:
      - "127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379"
    networks:
      - availia

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "127.0.0.1:${FORWARD_PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-secret}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - availia

  # ─────────────────────────────────────────────
  # Одноразовые сервисы — запускаются через `docker compose run --rm`
  # ─────────────────────────────────────────────

  composer:
    image: availia/php:dev
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    entrypoint: ["composer"]
    networks:
      - availia
    profiles: ["tools"]

  artisan:
    image: availia/php:dev
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html:delegated
    entrypoint: ["php", "/var/www/html/artisan"]
    networks:
      - availia
    profiles: ["tools"]
    depends_on:
      - postgres

  npm:
    image: node:current-alpine
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    ports:
      - "5173:5173"
    entrypoint: ["npm"]
    networks:
      - availia
    profiles: ["tools"]
